# 生产配置示例：MySQL + MinIO + Redis
# 启动：java -jar gongwen-server.jar --spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/gongwen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

app:
  token-store: redis
  push: redis
  storage:
    type: minio
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_AK:minioadmin}
      secret-key: ${MINIO_SK:minioadmin}
      bucket: ${MINIO_BUCKET:gongwen}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
